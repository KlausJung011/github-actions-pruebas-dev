name: CI pruebas automatizadas en dev
on:
    push:
        branches:
            - dev
    pull_request:
        branches: 
            - dev
jobs:
    test_app:
        name: Ejecutar pruebas Python
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout del codigo
                uses: actions/checkout@v5
            -   name: Configurar entorno de python
                uses: actions/setup-python@v5
                with:
                    python-version: "3.13"
            -   name: Instalar dependencias del proyecto
                run: |
                    python -m pip install --upgrade pip
                    pip install -r requirements.txt
            -   name: Ejecutar pruebas (unitarias, integracion y E2E)
                run: |
                    echo "Empezando con pruebas de python"
                    python -m pytest --rootdir . -s
            -   name: Reporte final
                run: echo "Pruebas aprobadas verifique resultados"